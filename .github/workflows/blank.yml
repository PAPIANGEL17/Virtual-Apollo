name: Build Professional Virtual Apollo Installer

on:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Ninja & CMake
      uses: lukka/get-cmake@latest

    - name: Set up MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DJUCE_USE_DIRECT2D=0

    - name: Build Application & Driver DLL
      run: cmake --build build

    - name: Download and Install Inno Setup
      run: |
        $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_2_2/innosetup-6.2.2.exe"
        $output = "mysetup.exe"
        Invoke-WebRequest -Uri $url -OutFile $output
        Start-Process -FilePath "$output" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait

    - name: Compile Professional Installer (.exe)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_installer.iss

    - name: Upload Professional Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Virtual-Apollo-Official-Installer
        path: Virtual_Apollo_Setup_v2.0.exe

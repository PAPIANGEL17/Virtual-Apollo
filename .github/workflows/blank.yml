name: Build Virtual Apollo EXE

on:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild / Visual Studio
      uses: microsoft/setup-msbuild@v2

    - name: Install JUCE Dependency via CPM/FetchContent
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Application
      run: cmake --build build --config Release

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Virtual-Apollo-Windows-EXE
        path: build/VirtualApolloCore_artefacts/Release/VirtualApolloCore.exe
